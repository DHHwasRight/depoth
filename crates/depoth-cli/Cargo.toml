[package]
name = "depoth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "depoth"
path = "src/main.rs"

[dependencies]
depoth.workspace = true
clap = { version = "4", features = ["derive"] }
anstyle = "1"
anstream = "1"
indicatif = "0.18"
inquire = "0.9"
anyhow = "1"
